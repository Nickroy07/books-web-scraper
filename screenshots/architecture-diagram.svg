<svg viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60a5fa"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="780" fill="url(#bg)"/>

  <!-- Title -->
  <text x="500" y="55" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">BOOKSCOPE — System Architecture</text>
  <text x="500" y="82" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Web Data → Intelligence → Decision</text>

  <!-- Stage boxes -->
  <!-- 1. Target Website -->
  <g filter="url(#softShadow)">
    <rect x="325" y="120" width="350" height="80" rx="14" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="325" y="120" width="8" height="80" rx="4" fill="url(#accentGrad)"/>
  <text x="500" y="150" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">🌐 Target Website</text>
  <text x="500" y="174" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Books to Scrape (books.toscrape.com)</text>

  <line x1="500" y1="200" x2="500" y2="240" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. Bright Data Scraper Studio -->
  <g filter="url(#softShadow)">
    <rect x="325" y="240" width="350" height="80" rx="14" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="325" y="240" width="8" height="80" rx="4" fill="url(#accentGrad)"/>
  <text x="500" y="270" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">🔧 Bright Data Scraper Studio</text>
  <text x="500" y="294" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Automated data collection engine</text>

  <line x1="500" y1="320" x2="500" y2="360" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. Structured Data -->
  <g filter="url(#softShadow)">
    <rect x="325" y="360" width="350" height="90" rx="14" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="325" y="360" width="8" height="90" rx="4" fill="url(#accentGrad)"/>
  <text x="500" y="392" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">🗂️ Structured Dataset</text>
  <text x="500" y="416" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">CSV / JSON — 1000 books</text>
  <text x="500" y="436" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">Title • Price • Rating • Availability • URL</text>

  <line x1="500" y1="450" x2="500" y2="490" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. Data Processing -->
  <g filter="url(#softShadow)">
    <rect x="325" y="490" width="350" height="80" rx="14" fill="url(#boxGrad)" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="325" y="490" width="8" height="80" rx="4" fill="url(#accentGrad)"/>
  <text x="500" y="520" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">⚙️ Frontend Data Processing</text>
  <text x="500" y="544" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Parsing, normalization &amp; value scoring</text>

  <line x1="500" y1="570" x2="500" y2="610" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 5. Dashboard -->
  <g filter="url(#softShadow)">
    <rect x="245" y="610" width="510" height="90" rx="14" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <rect x="245" y="610" width="8" height="90" rx="4" fill="url(#accentGrad)"/>
  <text x="500" y="642" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">📊 BOOKSCOPE Dashboard</text>
  <text x="500" y="666" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">KPIs • Filters • Charts • Smart Picks • Book Explorer</text>
  <text x="500" y="686" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="12">HTML • CSS • JavaScript</text>

  <line x1="500" y1="700" x2="500" y2="732" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 6. Insights -->
  <text x="500" y="765" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">💡 Insights &amp; Recommendations for the User</text>
</svg>
